<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物聯網應用工程師 互動刷題網 v2</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --correct: #16a34a;
            --correct-bg: #f0fdf4;
            --correct-border: #86efac;
            --wrong: #dc2626;
            --wrong-bg: #fef2f2;
            --wrong-border: #fca5a5;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px 12px;
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
            font-weight: 700;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        /* Mode Setup Card */
        .setup-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .setup-card h2 {
            font-size: 1.3rem;
            color: #1e3a8a;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 8px;
            color: var(--text);
        }

        .select-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 1rem;
            background: white;
            outline: none;
            cursor: pointer;
        }

        .mode-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mode-radio-btn {
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            background: white;
        }

        .mode-radio-btn:hover {
            border-color: var(--primary);
            background: #f0f7ff;
        }

        .mode-radio-btn.active {
            border-color: var(--primary);
            background: #eff6ff;
            font-weight: 700;
            color: var(--primary);
        }

        .start-btn {
            background: var(--primary);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 12px 36px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .start-btn:hover {
            background: var(--primary-hover);
        }

        /* Controls Area during Quiz */
        .quiz-controls {
            background: var(--card-bg);
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .info-tag {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-light);
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .stats {
            display: flex;
            gap: 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .stat-badge {
            padding: 4px 12px;
            border-radius: 20px;
        }

        .stat-correct { color: var(--correct); background: var(--correct-bg); }
        .stat-wrong { color: var(--wrong); background: var(--wrong-bg); }

        /* Quiz Card */
        .quiz-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border);
        }

        .q-tag {
            background: #eff6ff;
            color: var(--primary);
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .q-num {
            font-weight: 700;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .q-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text);
            white-space: pre-line;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: white;
            text-align: left;
            font-size: 0.98rem;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f0f7ff;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.selected-correct {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct) !important;
            font-weight: 600;
        }

        .option-btn.selected-wrong {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong) !important;
            font-weight: 600;
        }

        .option-btn.show-truth {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct) !important;
            font-weight: 600;
        }

        .feedback-box {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-box.correct {
            display: block;
            background: var(--correct-bg);
            border: 1px solid var(--correct-border);
            color: var(--correct);
            font-weight: 600;
        }

        .feedback-box.wrong {
            display: block;
            background: var(--wrong-bg);
            border: 1px solid var(--wrong-border);
            color: var(--wrong);
        }

        .feedback-box.wrong strong {
            color: #b91c1c;
        }

        /* Buttons & Summary */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #64748b;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .btn-restart {
            background: #16a34a;
        }

        .btn-restart:hover {
            background: #15803d;
        }

        .btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .pagination-bar {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .page-num {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .page-num.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .page-num.done-correct {
            border-color: var(--correct);
            color: var(--correct);
        }

        .page-num.done-wrong {
            border-color: var(--wrong);
            color: var(--wrong);
        }

        /* Result Card */
        .result-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .result-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin: 16px 0;
        }

        @media (max-width: 600px) {
            body { padding: 10px 8px; }
            header { padding: 18px 14px; }
            header h1 { font-size: 1.4rem; }
            .quiz-card { padding: 16px; }
            .mode-options { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ 物聯網應用工程師 互動刷題網</h1>
        <p>108-1 ~ 109-2 歷屆 200 題 ‧ 模式切換與即時檢驗</p>
    </header>

    <!-- SETUP VIEW -->
    <div id="setupView" class="setup-card">
        <h2>🎯 請選擇測驗模式與題型範圍</h2>

        <div class="form-group">
            <label>1. 選擇作答範圍：</label>
            <select id="scopeSelect" class="select-input">
                <option value="ALL">全部試題合輯 (共 200 題)</option>
                <option value="108-1">108-1 初級物聯網應用工程師 (50 題)</option>
                <option value="108-2">108-2 初級物聯網應用工程師 (50 題)</option>
                <option value="109-1">109-1 初級物聯網應用工程師 (50 題)</option>
                <option value="109-2">109-2 物聯網系統與應用 (50 題)</option>
            </select>
        </div>

        <div class="form-group">
            <label>2. 選擇題目排序模式：</label>
            <div class="mode-options">
                <div class="mode-radio-btn active" id="modeBtnSequential" onclick="setOrderMode('sequential')">
                    📌 依題庫順序作答
                </div>
                <div class="mode-radio-btn" id="modeBtnRandom" onclick="setOrderMode('random')">
                    🔀 隨機打亂題目
                </div>
            </div>
        </div>

        <button class="start-btn" onclick="startQuiz()">🚀 開始作答</button>
    </div>

    <!-- QUIZ VIEW (Hidden by default) -->
    <div id="quizView" style="display: none;">
        <div class="quiz-controls">
            <span class="info-tag" id="currentModeTag">順序模式 | 200題</span>
            <div class="stats">
                <span class="stat-badge stat-correct">✓ 正確: <span id="correctCount">0</span></span>
                <span class="stat-badge stat-wrong">✗ 錯誤: <span id="wrongCount">0</span></span>
            </div>
            <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="exitToSetup()">⚙️ 重設模式</button>
        </div>

        <div id="quizContainer"></div>

        <div class="nav-buttons">
            <button class="btn" id="prevBtn" onclick="changeQuestion(-1)">← 上一題</button>
            <button class="btn btn-restart" onclick="restartCurrentQuiz()">🔄 重新作答（若為隨機模式將重新打亂）</button>
            <button class="btn" id="nextBtn" onclick="changeQuestion(1)">下一題 →</button>
        </div>

        <div class="pagination-bar" id="paginationBar"></div>
    </div>

    <!-- RESULT VIEW (Hidden by default) -->
    <div id="resultView" class="result-card" style="display: none;">
        <h2>🎉 恭喜完成本次練習！</h2>
        <div class="result-score" id="resultScoreText">180 / 200</div>
        <p id="resultDetailText" style="margin-bottom: 24px; color: var(--text-light);"></p>
        <div style="display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;">
            <button class="btn btn-restart" onclick="restartCurrentQuiz()">🔄 重新作答（隨機打亂）</button>
            <button class="btn btn-secondary" onclick="exitToSetup()">⚙️ 重新選擇題型/模式</button>
        </div>
    </div>

器 PIR 常用於下列何種應用?", "type": "單選題", "ans": "D", "options": ["A. 車載資通訊電子服務", "B. 自動化倉儲系統", "C. 智慧電錶", "D. 智慧家庭"]}, {"id": 11, "exam": "108-1 初級物聯網應用工程師", "num": "11", "title": "下列何種 RFID 標籤型式，可適用於商品庫存盤點，並可以低成本、 遠距且一次讀取多個標籤?", "type": "單選題", "ans": "B", "options": ["A. 被動低頻(LF)RFID標籤", "B. 被動超高頻(UHF)RFID 標籤", "C. 被動高頻(HF)RFID 標籤", "D. 主動式 RFID 標籤"]}, {"id": 12, "exam": "108-1 初級物聯網應用工程師", "num": "12", "title": "比較條碼(Barcode)與無線射頻辨識(RFID)標籤特性，下列敘述何者正確?", "type": "單選題", "ans": "D", "options": ["A. RFID成本較低", "B. RFID 讀取速度較慢", "C. RFID 可用手機鏡頭掃描讀取", "D. RFID較難偽造"]}, {"id": 13, "exam": "108-1 初級物聯網應用工程師", "num": "13", "title": "依據 ISO 18000-6C/63 標準，定義標籤回傳信號之編碼方式有 FM0 碼 及米勒調整(Modified Miller)碼等。請問標籤如何決定使用何種編 碼方式?", "type": "單選題", "ans": "C", "options": ["A. 由標籤任意決定無須通知讀取器", "B. 由讀取器自行決定，無需通知標籤", "C. 由讀取器以指令指示標籤使用何種編碼", "D. 由標籤決定再以信號通知讀取器"]}, {"id": 14, "exam": "108-1 初級物聯網應用工程師", "num": "14", "title": "下列何者為悠遊卡與讀取器之間正確的通訊步驟?\n1. 防碰撞機制(Anti-Collision Loop Get Serial Number) \n\n2. 選卡(Select Card)\n\n3. 驗證(3-pass Authentication Sector Specific)\n\n4. 詢卡(Request Standard/All)", "type": "單選題", "ans": "D", "options": ["A. 1234", "B. 4231", "C. 4321", "D. 4123"]}, {"id": 15, "exam": "108-1 初級物聯網應用工程師", "num": "15", "title": "詢答器藉由傳輸連續波(CW)之無線射頻信號給 RFID 標籤，供給 標籤之電源;而標籤藉由調變天線之反射係數，並反向散射資訊回應 給詢答器，以致詢答器可獲得標籤上之資訊。此系統如採用詢答器先 言(Interrogator-Talks-First, ITF)的模式，下列敘述何者正確?", "type": "單選題", "ans": "A", "options": ["A. 標籤僅當詢答器直接發話要求時，才調變其天線反射係數回覆資 訊信號", "B. 詢答器僅當標籤直接發話要求時，才調變其天線反射係數回覆資 訊信號", "C. 標籤僅當詢答器直接發話要求時，不調變其天線反射係數回覆資 訊信號", "D. 不管標籤或詢答器有無發話要求，皆定時調變其天線反射係數回 覆資訊信號"]}, {"id": 16, "exam": "108-1 初級物聯網應用工程師", "num": "16", "title": "下列何者是最常被使用在物聯網的傳輸加密技術?", "type": "單選題", "ans": "C", "options": ["A. PKI", "B. PPP", "C. TLS", "D. RTSP"]}, {"id": 17, "exam": "108-1 初級物聯網應用工程師", "num": "17", "title": "17.\n關於電路交換(Circuit Switching)及分封交換(Packet Switching)， 下列敘述何者「不正確」?", "type": "單選題", "ans": "A", "options": ["A. 相較於分封交換網路，電路交換網路在頻寬的使用上較不會浪費", "B. 在電路交換網路中，資料一定會按照順序到達", "C. 電路交換網路會為通訊的兩個端點建立專用的實  "exam": "108-1 初級物聯網應用工程師", "num": "45", "title": "行動支付是指使用行動裝置進行付款的服務。例如:在不使用現金、 支票或信用卡的情況下，消費者可使用行動裝置支付各項服務或數位 及實體商品的費用。請問下列何者「不屬於」行動支付的類型?", "type": "單選題", "ans": "B", "options": ["A. 非接觸型支付(NFC)", "B. 網路 ATM 轉帳匯款", "C. 行動裝置網路支付", "D. QR Code 支付"]}, {"id": 46, "exam": "108-1 初級物聯網應用工程師", "num": "46", "title": "下列何者屬於 EPCglobal 標準的擷取層(Capture)的應用?", "type": "單選題", "ans": "B", "options": ["A. 一間軟體公司推出手機透過條碼查詢產品應用的程式，消費者可透過這程式，掃描條碼到雲端資料庫查詢產品的規格", "B. 圖書館員用 UHF RFID 讀取器，讀取每本貼附 UHF RFID 標籤的書，進行圖書盤點作業再傳送至圖書館資訊系統", "C. RFID 標籤寫入商品 EPC 編碼作業", "D. 建立商品履歷雲端資料庫，將所有商品的資料，輸入到雲端資料庫裡，以日後供追蹤追溯使用"]}, {"id": 47, "exam": "108-1 初級物聯網應用工程師", "num": "47", "title": "在供應鏈日常商業運作中，若要表示出貨前需將數十件貼附 EPC 編 碼之商品外箱堆疊在棧板上，在一般應用之下應採用下列何種 RFID 標籤?", "type": "單選題", "ans": "B", "options": ["A. 低頻標籤(LF)", "B. 超高頻標籤(UHF)", "C. 高頻標籤(HF)", "D. 主動式微波標籤(Microwave)"]}, {"id": 48, "exam": "108-1 初級物聯網應用工程師", "num": "48", "title": "Low-Level Reader Protocol(LLRP)為 EPC/RFID 讀取器與 client 端 間的通訊協定標準，下列何者「不是」LLRP 的功能?", "type": "單選題", "ans": "D", "options": ["A. Client端傳送Reader端之訊息，包括Reader的組態(configuration)獲得和設定", "B. 搜尋 Reader 能力以及管理 Reader 盤查和存取操作", "C. Reader 端傳送 Client 端訊息包括回報 Reader 狀態、無線射頻調查(RF Servey)以及盤點和存取結果", "D.  可以使用 RFID 讀取器管理功能，包括搜尋、韌體/軟體設定與更新，並管理讀取器耗電量"]}, {"id": 49, "exam": "108-1 初級物聯網應用工程師", "num": "49", "title": "EPCglobal 標準中\"EPCIS Event\"包含之 What、When、Where、Why， 下列何者為「Where」所代表意義?", "type": "單選題", "ans": "D", "options": ["A. 貨物上RFID標籤讀取數量", "B. 讀取貨物上 RFID 編碼", "C. 貨物上 RFID 標籤被讀取日期時間", "D.  貨物上RFID標籤在何處被讀取"]}, {"id": 50, "exam": "108-1 初級物聯網應用工程師", "num": "50", "title": "下列何者為 EPCglobal 標準中定義 EPCIS 事件資料內，說明物件為何 (Why)被讀取時， <Bizstep>urn:epcglobal:cbv:bizstep:shipping</Bizstep>，shipping 所代 表的意義?", "type": "單選題", "ans": "A", "options": ["A. 貨物出貨中", "B. 運輸中", "C. 己收貨", "D. 退貨"]}, {"id": 51, "exam": "108-2 初級物聯網應用工程師", "num": "1", "title": "關於樹莓派(Raspberry Pi)，下列敘述何者「不正確」?", "type": "單選題", "ans": "C", "options": ["A. 原目的是讓小孩擁有學習編寫程式之環境", "B. 是價格低廉之微型電腦", "C. 可完全取代筆記型電腦", "D. 可作為DIY產品之零件"]}, {"id": 52, "exam": "108-2 初級物聯網應用工程師", "num": "2", "title": "一個典型的 Arduino C/C++ sketch 程式，預設會包含哪兩個函式?", "type": "單選題", "ans": "C", "options": ["A. init()以及loop()", "B. setup()以及 main()", "C. setup()以及 loop()", "D. main()以及include()"]}, {"id": 53, "exam": "108-2 初級物聯網應用工程師", "num": "3", "title": "序列埠(serial port)RS232 是非常常見的物聯網設備通訊協定。某個 設備僅有一條 USB 線連接出來，另一端是 USB type-A 接頭。請問， 下列敘述何者「不正確」?", "type": "單選題", "ans": "C", "options": ["A. 可透過查閱設備文件，得知該設備是否支援RS232通訊協定", "B. 可將此設備插到電腦，在安裝驅動程式後，透過「裝置管理員」 查看得知是否支援 RS232 通訊協定", "C. 此設備不可能透過序列埠通訊", "D. 此設備透過USB供電"]}, {"id": 54, "exam": "108-2 初級物聯網應用工程師", "num": "4", "title": "關於 WoT(Web of Things)，下列敘述何者「不正確」?", "type": "單選題", "ans": "B", "options": ["A. 以URL來表示IoT裝置", "B. 遵循 EPCIS 架構", "C. 可用目前常用的網頁程式來開發相關應用", "D. IoT + Web-enabled technologies"]}, {"id": 55, "exam": "108-2 初級物聯網應用工程師", "num": "5", "title": "下列何者為無線感測器之硬體架構中微控制器(Micro Controller Unit, MCU)的主要功能?", "type": "單選題", "ans": "D", "options": ["A. 負責光線、溫度、濕度、壓力、磁力、振動、電流等的變化", "B. 量測數據封包", "C. 電力的提供及降低功耗", "D. 負責執行感測資料收集與運算"]}, {"id": 56, "exam": "108-2 初級物聯網應用工程師", "num": "6", "title": "下列何種嵌入式系統是使用 Atmel 單晶片(例如:ATmega328P、 ATmega168)，採用開放原始碼的軟硬體平台，構建於開放原始碼 simple I/O 介面板，並具有使用類似 Java、C 語言等的開發環境?", "type": "單選題", "ans": "C", "options": ["A. TICC2538DK", "B. Raspberry Pi", "C. Arduino", "D. LinkIt"]}, {"id": 57, "exam": "108-2 初級物聯網應用工程師", "num": "7", "title": "下列何者是物聯網(IoT)的英文縮寫?", "type": "單選題", "ans": "B", "options": ["A. Intranet of Things", "B. Internet of Things", "C. Internet over Things", "D. Interconnect of Things"]}, {"id": 58, "exam": "108-2 初級物聯網應用工程師", "num": "8", "title": "若想實現智慧型路燈，藉由偵測日夜以及是否有人車經過，以決定是 否開啟照明，採用下列何種感測器的組合較為合適?", "type": "單選題", "ans": "A", "options": ["A. 光感應器+紅外線感測器", "B. 陀螺儀+電子羅盤", "C. 光感應器+加速度計", "D. 超音波+紅外線感測器"]}, {"id": 59, "exam": "108-2 初級物聯網應用工程師", "num": "9", "title": "藍牙 4.0 的協定中「不包括」下列何種模式?", "type": "單選題", "ans": "D", "options": ["A. 低功耗藍牙(Bluetooth low energy)", "B. 傳統藍牙(Classic Bluetooth)", "C. 高速藍牙(Bluetooth high speed)", "D. 網狀藍牙(BluetoothMesh)"]}, {"id": 60, "exam": "108-2 初級物聯網應用工程師", "num": "10", "title": "下列何者為 Docker 的執行元件?", "type": "單選題", "ans": "D", "options": ["A. daemon、server、dotCloud、libcontainer", "B. server、Image、controller、container", "C. client、server、Image、daemon", "D. client、daemon、libcontainer、Image"]}, {"id": 61, "exam": "108-2 初級物聯網應用工程師", "num": "11", "title": "透過取得公開資料來豐富物聯網系統的資料來源，可以增加資料分析 的豐富性。有一天，系統發現公開資料的數據不正確(例如:明明有 下雨、但公開資料是晴天)。下列何者是可能的原因?", "type": "單選題", "ans": "C", "options": ["A. 同時有太多人存取資料", "B. 物聯網平台的網路斷線", "C. 公開數據沒有更新", "D. 程式寫錯了"]}, {"id": 62, "exam": "108-2 初級物聯網應用工程師", "num": "12", "title": "某個物聯網應用模式為:透過 APP 取得使用者的 GPS 資料，來決定要 推播哪種優惠資訊。有一天，某使用者到了一個常去的地點，卻沒有 收到優惠資訊，但該使用者卻可以玩寶可夢抓寶、且同行的人有收到 優惠資訊。請問最有可能是下列何種狀況?", "type": "單選題", "ans": "D", "options": ["A. GPS晶片整個壞掉了", "B. 該地點的 GPS 訊號被遮蔽了", "C. 推播系統當掉了", "D. 使用者關閉這個APP取用GPS的功能"]}, {"id": 63, "exam": "108-2 初級物聯網應用工程師", "num": "13", "title": "小明家的智慧 NFC 門鎖突然無法開門，請問下列何者是可能的原因?", "type": "單選題", "ans": "D", "options": ["A. 小明用來開門的NFCAndroid手機沒有網路", "B. 小明用來開門的 NFC Android 手機，沒有開啟對應 APP", "C. 小明用來開門的 NFC Android 手機，沒有開啟 GPS", "D. 智慧門鎖電池沒電了"]}, {"id": 64, "exam": "108-2 初級物聯網應用工程師", "num": "14", "title": "請問如何確認某一顆感測器沒電了?", "type": "單選題", "ans": "B", "options": ["A. 從平台端查看該顆感測器是否有回傳資訊至後台", "B. 原本沒有收到訊號，換一顆電池後就收到訊號了", "C. 從感測器回傳的感測資料來判斷", "D. 用感測器的資料回傳週期來判斷"]}, {"id": 65, "exam": "108-2 初級物聯網應用工程師", "num": "15", "title": "虛擬化作業需不斷的進行運行監控，以隨時改善其運作效能。下列何 者較不易影響運作效能?", "type": "單選題", "ans": "B", "options": ["A. 儲存設備的硬碟轉速太慢", "B. 資料儲存空間較小", "C. 記憶體容量太小", "D. CPU等級不高"]}, {"id": 66, "exam": "108-2 初級物聯網應用工程師", "num": "16", "title": "若客戶希望所使用的物聯網通訊協定包含服務品質(Quality of Service, QoS)以確保資料傳輸的可靠度，「不建議」使用下列何種通訊協定?", "type": "單選題", "ans": "B", "options": ["A. MQTT", "B. HTTP", "C. CoAP", "D. AMQP"]}, {"id": 67, "exam": "108-2 初級物聯網應用工程師", "num": "17", "title": "物聯網系統開發的「系統擴充性」評估重點，「不包含」下列何者?", "type": "單選題", "ans": "B", "options": ["A. 支援多種裝置連線", "B. 使用者操作介面設計", "C. 感測器終端設備增加時或據點增加時的導入步驟", "D. 支援感測間隔變更與終端設備增加"]}, {"id": 68, "exam": "108-2 初級物聯網應用工程師", "num": "18", "title": "下列何者「無法」用來評估使用者情緒是否在放鬆狀態?", "type": "單選題", "ans": "C", "options": ["A. 腦波", "B. 攝影機", "C. BMI", "D. 肌電位"]}, {"id": 69, "exam": "108-2 初級物聯網應用工程師", "num": "19", "title": "物聯網系統開發的「運作與維護」評估重點，「不包含」下列何項?", "type": "單選題", "ans": "A", "options": ["A.  支援多種裝置連線", "B. 評估控制通訊成本的方法", "C. 確保遠端閘道器的運作方法", "D. 裝置與閘道器故障時的排除方法"]}, {"id": 70, "exam": "108-2 初級物聯網應用工程師", "num": "20", "title": "Apple 第四代以後的智慧手錶提供跌倒通報服務，當智慧手錶偵測出 跌倒時，手錶會出現緊急按鈕，在固定時間內若摔倒者不解除警報的 話，智慧手錶會自動撥出求救訊號。小明用樹莓派(Raspberry Pi)搭 配 G-sensor 想要做出類似的應用，但是誤報率很高。下列何者「無法」 有效降低誤報率?", "type": "單選題", "ans": "D", "options": ["A. 收集跌倒時的感測器資料樣態(Pattern)，藉此修改演算法", "B. 加裝陀螺儀", "C. 加裝心律儀", "D. 改採用Arduino來代替樹莓派"]}, {"id": 71, "exam": "108-2 初級物聯網應用工程師", "num": "21", "title": "物聯網的資訊傳遞分為兩階段，第一階段是前端節點間的無線通訊， 第二階段則是資訊收集器上傳到雲端資訊系統。請問在第一階段的無 線通訊中，下列敘述何者正確?", "type": "單選題", "ans": "B", "options": ["A. 無線通訊的資料不需要做資安保護，因為資訊是透過無線訊號傳輸，沒人可以拿到這些資料", "B. 無線通訊的資料需要做資安保護，因為任何人都可能竊聽中間的資料", "C. 無線通訊的資料不需要做資安保護，因為這些資料沒有實際利用價值", "D. 無線通訊的資料需要做資安保護，因為傳輸的資料內容可能會有誤差"]}, {"id": 72, "exam": "108-2 初級物聯網應用工程師", "num": "22", "title": "在物聯網中，駭客可能會竊走設備間傳輸的資料，竄改之後再傳送給 另外一方。這是屬於哪一類的攻擊手法?", "type": "單選題", "ans": "A", "options": ["A. 中間人攻擊(Man-in-the-MiddleAttack)", "B. 密碼攻擊(Password-Based Attack)", "C. 金鑰淪陷攻擊(Compromised-Key Attack)", "D. 阻斷服務攻擊(Denial-of-ServiceAttack)"]}, {"id": 73, "exam": "108-2 初級物聯網應用工程師", "num": "23", "title": "「因為 RFID 標籤的識別資訊可與持有者產生關聯，如果持有者的 RFID 標籤遭竊或丟棄，可能會被有心人士利用來假冒原先持有者的身分， 進行不法之行為，因而陷害原先的持有者。」請問上述內容是屬於何 種威脅?", "type": "單選題", "ans": "B", "options": ["A. 消費者購物隱私", "B. 消費者身分隱私", "C. 消費者行蹤隱私", "D. 消費者家庭隱私"]}, {"id": 74, "exam": "108-2 初級物聯網應用工程師", "num": "24", "title": "下列何者是利用多台電腦攻擊特定主機？", "type": "單選題", "ans": "B", "options": ["A. 邏輯炸彈（Logic Bomb）", "B. 分散式阻斷服務（DDoS）", "C. 網路蠕蟲（Worm）", "D. 分散式運算（Distributed computing"]}, {"id": 75, "exam": "108-2 初級物聯網應用工程師", "num": "25", "title": "下列哪些安全事件是因「物聯網」所衍生的安全問題？\n(1) 手機因故障送修，手機內的隱私照片遭維修人員竊取\n(2) 駭客入侵智慧手環，用來追蹤日常生活的路線與習慣\n(3) 交通號誌遭駭客入侵，數位顯示板的內容遭到竄改\n(4) 車輛遭到駭客操控，從遠端操控車輛讓引擎熄火並猛踩煞車", "type": "單選題", "ans": "D", "options": ["A. (1), (2), (3)", "B. (1), (2), (4)", "C. (1), (3), (4)", "D. (2), (3), (4)"]}, {"id": 76, "exam": "108-2 初級物聯網應用工程師", "num": "26", "title": "物聯網底層硬體開發常用樹莓派（Raspberry Pi）板，其主要運算核心\n架構為下列何者？", "type": "單選題", "ans": "B", "options": ["A. 80x86 based", "B. ARM based", "C. 8051 based", "D. FPGA"]}, {"id": 77, "exam": "108-2 初級物聯網應用工程師", "num": "27", "title": "物聯網應用在環境監控（例如：溫濕度及有害氣體等）特色為大量感\n測器的配置與資料蒐集，為此設計的感測器通訊，應著重於下列何者\n特性？", "type": "單選題", "ans": "B", "options": ["A. 加密性高，採用對稱性加密方法", "B. 省電、資料傳輸量不需要太大", "C. 對不同感測器資料採用不同封包格式", "D. 資料壓縮"]}, {"id": 78, "exam": "108-2 初級物聯網應用工程師", "num": "28", "title": "物聯網可應用 Open source 來做系統開發，基於 Apache Cassandra \nNoSQL database，開發 Machine to machine 之應用者，主要是下列何種\ndevelopment tool？", "type": "單選題", "ans": "C", "options": ["A. Eclipse IoT project", "B. KinomaJS", "C. M2M Labs Mainspring", "D. Node-RED"]}, {"id": 79, "exam": "108-2 初級物聯網應用工程師", "num": "29", "title": "關於 Arduino 的授權範圍，下列敘述何者「不正確」？", "type": "單選題", "ans": "B", "options": ["A. 硬體設計採用創用CC姓名標示-相同方式分享（Creative Commons Attribution Share-Alike）授權", "B. 硬體製造採用 BSD 授權", "C. Java 環境的程式源碼採用 GPL 授權", "D. C/C++微控制器函式庫採用 LGPL 授權"]}, {"id": 80, "exam": "108-2 初級物聯網應用工程師", "num": "30", "title": "關於 Arduino 開發板，下列敘述何者正確？", "type": "單選題", "ans": "D", "options": ["A. Arduino UNO 內建藍牙通訊模組", "B. Arduino 軟體開發環境所用的程式語言語法類似於 JavaScript", "C. Arduino UNO 內建溫度感測模組", "D. Arduino 是一個開放原始碼的 Atmel AVR 單晶片微電腦"]}, {"id": 81, "exam": "108-2 初級物聯網應用工程師", "num": "31", "title": "請問下列何者是開源硬體？", "type": "單選題", "ans": "A", "options": ["A. Ardunio Uno", "B. LinkIt", "C. Micro:bit", "D. GitHub"]}, {"id": 82, "exam": "108-2 初級物聯網應用工程師", "num": "32", "title": "關於開源硬體，下列敘述何者「不正確」？", "type": "單選題", "ans": "C", "options": ["A. 通常使用開源軟體來驅動開源硬體", "B. 開源硬體核心價值在於開放與自由", "C. 開源硬體的規範只依循 GPL（General Public License）通用公共授權條款", "D. 開源硬體主要包含線路圖（Schematic）、佈線圖（Layout）、零件佈局、零件表（BOM）等"]}, {"id": 83, "exam": "108-2 初級物聯網應用工程師", "num": "33", "title": "關於 Raspberry Pi 3 嵌入式主機板，下列敘述何者「不正確」？", "type": "單選題", "ans": "A", "options": ["A. 內建藍牙 5.0 通訊功能", "B. 有許多 GPIO 接腳（pin）用來控制外部硬體", "C. 具備 HDMI、Audio jack、Ethernet 介面", "D. 具備 SD 記憶卡擴充功能"]}, {"id": 84, "exam": "108-2 初級物聯網應用工程師", "num": "34", "title": "關於微控制器中斷（Interrupt），下列敘述何者「不正確」？", "type": "單選題", "ans": "C", "options": ["A. 可使微控制器能在執行程式時在背景偵測某些事件", "B. 事件可能是輸入腳位的觸發、Timer 計數時間到或收到串列埠上的資料", "C. 中斷向量可以接受參數的輸入", "D. 當中斷發生時，微控制器會載入一個中斷向量（Interrupt Vector）到程式計數器"]}, {"id": 85, "exam": "108-2 初級物聯網應用工程師", "num": "35", "title": "若對 UART（Universal Asynchronous Receiver/Transmitter）設定鮑率\n（Baud Rate）為 9600bps、8 個資料位元、無同位元檢查及 1 個停止位\n元，則信號從起始位元開始到停止位元傳送完畢，共約需花費多少時\n間？", "type": "單選題", "ans": "B", "options": ["A. 104μs", "B. 1.04ms", "C. 10.4ms", "D. 104ms"]}, {"id": 86, "exam": "108-2 初級物聯網應用工程師", "num": "36", "title": "單板電腦或單晶片大多支援 UART、I2C 與 SPI。關於這三種介面，下列敘述何者正確？", "type": "單選題", "ans": "C", "options": ["A. UART 傳輸速度最慢，且只能以半雙工模式運作", "B. I2C 連接的設備可達 128 個，且是全雙工模式運作的", "C. SPI 提供較 I2C 更快的速度，但裝置數越多，SPI 要使用的線路也會越多", "D. 一般來說，SPI 是運用來實現 RS-232 介面"]}, {"id": 87, "exam": "108-2 初級物聯網應用工程師", "num": "37", "title": "Wayne 透過單板電腦的 UART 介面進行韌體除錯作業，但是終端機程\n式卻顯示了一堆亂碼，而不是作業系統登入提示。請問 Wayne 可能做\n錯了什麼？", "type": "單選題", "ans": "C", "options": ["A. TX/RX 接錯", "B. Wayne 應該用的是 JTAG 介面而不是 UART", "C. 雙方的 Baud Rate 不一致", "D. Wayne 沒有做錯，因為損壞的是單板電腦的顯示晶片"]}, {"id": 88, "exam": "108-2 初級物聯網應用工程師", "num": "38", "title": "物聯網雲端平台並「不」負責處理下列何種功能？", "type": "單選題", "ans": "C", "options": ["A. 資料蒐集與儲存", "B. 資料查詢與分析", "C. 近端裝置通訊與開發", "D. 監控數據變更通知"]}, {"id": 89, "exam": "108-2 初級物聯網應用工程師", "num": "39", "title": "某小學建置校園 PM2.5 監測系統，並製作一個網頁透過 HTML 的\n<meta>元素，讓瀏覽器每隔 30 秒自動更新頁面，即時顯示 PM2.5 資\n訊。但發現瀏覽器整個畫面會不斷地更新，且每次重新整理，會向伺\n服器提取整個網頁，浪費網路頻寬與伺服器資源。請問下列何者技術\n可以讓網頁只定時更新 PM2.5 數據，不需重新整理整個網頁？", "type": "單選題", "ans": "C", "options": ["A. DOM", "B. CSS3", "C.  AJAX", "D. HTML5"]}, {"id": 90, "exam": "108-2 初級物聯網應用工程師", "num": "40", "title": "物聯網實現應用需分析處理大量的資料，而要處理這些資料，尤其是\n這些資料往往來自於分散式的資料庫，以 NoSQL 的分散式資料庫管理\n概念，來統合各項資料並進行分析，下列何者是主要的分析法？", "type": "單選題", "ans": "A", "options": ["A. <Key, Value>資料分類與關聯性建立", "B. ANOVA 變異數分析", "C. Cloud R 統計分析", "D. TRIZ 創新法"]}, {"id": 91, "exam": "108-2 初級物聯網應用工程師", "num": "41", "title": "關於 NoSQL，下列敘述何者「不正確」？", "type": "單選題", "ans": "A", "options": ["A. 主要用來儲存結構化文件", "B. 主要用來儲存非結構化文件", "C. 資料結構往往是鬆散的樹狀結構", "D. 概念源自 Lotus Note 儲存文件的方式"]}, {"id": 92, "exam": "108-2 初級物聯網應用工程師", "num": "42", "title": "智慧手錶/手環蒐集身體的健康資料，下列何者較「不」常見？", "type": "單選題", "ans": "D", "options": ["A. 心跳", "B. 走/跑距離", "C. 睡眠追蹤", "D. 身高體重"]}, {"id": 93, "exam": "108-2 初級物聯網應用工程師", "num": "43", "title": "自由開源軟體的商標權授權金是可以收取的，例如：Apache Software \nFoundation 相關的軟體均會出現的羽毛（Apache），或者是貓\n（Tomcat）。因此，若選用 Apache Tomcat 當作網站伺服器，下列敘述\n何者「不正確」？", "type": "單選題", "ans": "B", "options": ["A. 在商業廣告上宣傳這隻貓的圖樣或 Tomcat 字樣，需收費", "B. 不需收費也不需取得該商標的書面授權", "C. 產品包裝後再散布時，若無移除商標的圖標及圖形，需收費", "D. 在涉及商業利用上，若在廣告上需要宣傳貓的圖樣，或者是產品散布時仍包含此商標，則必須取得該商標的書面授權"]}, {"id": 94, "exam": "108-2 初級物聯網應用工程師", "num": "44", "title": "關於開源軟體（Open Source Software），下列敘述何者正確？", "type": "單選題", "ans": "C", "options": ["A. 開源軟體一定是免費軟體", "B. 免費軟體一定是開源軟體", "C. 修改過的開源軟體在授權許可下，可再回饋給社群", "D. 開源軟體可任意再授權修改後的原始碼"]}, {"id": 95, "exam": "108-2 初級物聯網應用工程師", "num": "45", "title": "下列開源協議（Open Source License）對於引用/修改/衍生的程式碼要求最為嚴格？", "type": "單選題", "ans": "B", "options": ["A. LGPL", "B. GPL", "C. BSD", "D. 以上的協議的要求均相同"]}, {"id": 96, "exam": "108-2 初級物聯網應用工程師", "num": "46", "title": "下列何種軟體，本身享有著作權保護，但可藉由發佈通用公共授權（General Public License），允許使用者對該軟體進行重製、散佈與修改？", "type": "單選題", "ans": "A", "options": ["A. 自由軟體", "B. 共享軟體", "C. 公共領域軟體", "D. 商業試用軟體"]}, {"id": 97, "exam": "108-2 初級物聯網應用工程師", "num": "47", "title": "下列軟體的定義與精神，何者與開放源碼（Open Source Software）的屬性最為接近？", "type": "單選題", "ans": "B", "options": ["A. 免費軟體（Freeware）", "B. 自由軟體（Free Software）", "C. 共享軟體（Shareware）", "D. 專屬軟體（Proprietary Software）"]}, {"id": 98, "exam": "108-2 初級物聯網應用工程師", "num": "48", "title": "Oracle MySQL 是具有「雙重授權」的開源軟體。下列敘述何者「不正\n確」？", "type": "單選題", "ans": "C", "options": ["A. 使用者可選擇以 GPL 方式使用 Oracle MySQL 資料庫，且不用支付授權金", "B. 使用者可選擇以 GPL 方式使用 Oracle MySQL 資料庫，且受 GPL規範", "C. 使用者可選擇以商業授權方式使用 Oracle MySQL 資料庫，且不用支付授權金", "D. 使用者可選擇以商業授權方式使用 Oracle MySQL 資料庫，且不受 GPL 規範"]}, {"id": 99, "exam": "108-2 初級物聯網應用工程師", "num": "49", "title": "開源軟體除了允許使用者自由使用、散佈、改作之外，也要求使用者\n改作後的衍生作品必須要以同等的授權方式釋出，以回饋社群。下列何者為此授權方式？", "type": "單選題", "ans": "B", "options": ["A. Copyright", "B. Copyleft", "C. Copyup", "D. Copydown"]}, {"id": 100, "exam": "108-2 初級物聯網應用工程師", "num": "50", "title": "下列何者「不是」自由、開源軟體？", "type": "單選題", "ans": "D", "options": ["A. vim Editor", "B. Eclipse IDE", "C. FileZilla FTP client", "D. IIS Web Server"]}, {"id": 101, "exam": "109-1 初級物聯網應用工程師", "num": "1", "title": "物聯網架構分為三層，「不包含」下列何者?", "type": "單選題", "ans": "C", "options": ["A. 感知層", "B. 網路層", "C. 傳輸層", "D. 應用層"]}, {"id": 102, "exam": "109-1 初級物聯網應用工程師", "num": "2", "title": "關於物聯網感知層，下列敘述何者「不正確」?", "type": "單選題", "ans": "C", "options": ["A. 可針對不同的情景、場域進行感知與監測", "B. 感測設備具有感測與通訊能力", "C. 大多數的感測設備具有分析與解讀資料能力", "D. 各感測器間不需要分享與交換資料"]}, {"id": 103, "exam": "109-1 初級物聯網應用工程師", "num": "3", "title": "物聯網架構分為三層，請問「健康管理」這個主題位於哪一層?", "type": "單選題", "ans": "C", "options": ["A. 感知層", "B. 網路層", "C. 應用層", "D. 傳輸層"]}, {"id": 104, "exam": "109-1 初級物聯網應用工程師", "num": "4", "title": "下列何者「不屬於」物聯網網路層的技術?", "type": "單選題", "ans": "B", "options": ["A. 非同步傳輸網路技術", "B. 無線感測器技術", "C. 無線通訊技術", "D. 高速網路技術"]}, {"id": 105, "exam": "109-1 初級物聯網應用工程師", "num": "5", "title": "關於控制單元，下列敘述何者「不正確」?", "type": "單選題", "ans": "D", "options": ["A. 微控制器(MicrocontrollerUnit,MCU)，是把微處理器、快閃記憶體和主記憶體等包在同一個晶片裡，常用來做簡單的控制", "B. 微處理運算單元(MicroprocessorUnit,MPU)，可執行程式指令、進行運算和邏輯處理", "C. 系統晶片(SystemonChip,SoC)，整合微處理器和特定功能硬體", "D. x86CPU架構過於複雜，不適合物聯網的應用"]}, {"id": 106, "exam": "109-1 初級物聯網應用工程師", "num": "6", "title": "下列何者是由國際電信標準制定組織 3GPP 所支持，針對物聯網所 打造的電信級網路?", "type": "單選題", "ans": "A", "options": ["A. NB-IoT", "B. BLE", "C. RFID", "D. IEEE802.11ac"]}, {"id": 107, "exam": "109-1 初級物聯網應用工程師", "num": "7", "title": "大型或複雜的物聯網系統往往是由各種不同的子系統組合而成，其 中包括不同的硬體、網路與作業系統等，需透過下列何者以調整子 系統間的差異?", "type": "單選題", "ans": "B", "options": ["A. 測試軟體", "B. 中介軟體", "C. 應用軟體", "D. 系統軟體"]}, {"id": 108, "exam": "109-1 初級物聯網應用工程師", "num": "8", "title": "關於 Arduino 與 Micro:bit，下列敘述何者「不正確」?", "type": "單選題", "ans": "C", "options": ["A. Arduino內建僅包括輸出入腳位，而Micro:bit還提供按鈕、藍牙與LED模組", "B. 皆能透過圖形化的程式編輯工具來開發", "C. 皆能使用杜邦線來連接外部設備", "D. Arduino兼容3.3V及5V供應電壓，而Micro:bit僅支援3V供應電壓"]}, {"id": 109, "exam": "109-1 初級物聯網應用工程師", "num": "9", "title": "下列何者屬於微控制器的週邊電路所負責之功能?", "type": "單選題", "ans": "B", "options": ["A. 甲、乙、丙", "B. 甲、丙、戊", "C. 乙、丙、戊", "D. 甲、乙、丙、戊"]}, {"id": 110, "exam": "109-1 初級物聯網應用工程師", "num": "10", "title": "在物聯網中，Beacon 技術扮演著室內定位的角色，下列何者為該技 術應用?", "type": "單選題", "ans": "B", "options": ["A. 商品經過結帳台時，自動幫使用者結算金額", "B. 旅客經過攤位時，手機自動顯示攤位簡介及打折商品", "C. 將商品移入或移出倉庫時，可自動顯示商品的庫存量", "D. 有人進入或離開房間時，可自動開啟或關閉燈光及空調設備"]}, {"id": 111, "exam": "109-1 初級物聯網應用工程師", "num": "11", "title": "關於無線射頻辨識技術(Radio Frequency Identification, RFID)運作 的原理與傳輸特性，下列敘述何者「不正確」?", "type": "複選題", "ans": "C,D", "options": ["A. 低頻傳輸採用電磁感應式，屬於近距離傳遞", "B. 超高頻傳輸採用電磁波反向傳播式，屬於遠距離傳遞", "C.  微波傳輸採用電磁感應式，屬於近距離傳遞", "D.  高頻傳輸採用電磁波反向傳播式，屬於遠距離傳遞"]}, {"id": 112, "exam": "109-1 初級物聯網應用工程師", "num": "12", "title": "關於樹莓派 4.0B(Raspberry Pi 4.0B)，下列敘述何者「不正確」?", "type": "單選題", "ans": "C", "options": ["A. 是一種單板電腦(Single Board Computer)", "B. 需要安裝作業系統", "C.  支援連接無線網路，但沒有乙太有線網路介面", "D. 支援 HDMI 與立體聲輸出"]}, {"id": 113, "exam": "109-1 初級物聯網應用工程師", "num": "13", "title": "樹莓派(Raspberry Pi)的螢幕上偶爾出現黃色閃電符號(如附圖右 上角)，請問代表什麼意思?", "type": "單選題", "ans": "D", "options": ["A. CPU 進入全速運轉模式(Turbo Mode)", "B. 目前 CPU 過熱", "C. 網路頻寬使用率已達到設定上限", "D. 目前電力不足"]}, {"id": 114, "exam": "109-1 初級物聯網應用工程師", "num": "14", "title": "請問下列何者可能導致硬體主板燒毀?", "type": "單選題", "ans": "D", "options": ["A. GPIO輸出直接接到GPIO輸入", "B. GPIO輸入直接接到GND", "C. 3.3V輸出直接接到GPIO輸入", "D. 5V輸出直接接到GPIO輸入"]}, {"id": 115, "exam": "109-1 初級物聯網應用工程師", "num": "15", "title": "當開啟通用非同步收發傳輸器(Universal Synchronous Asynchronous Receiver Transmitter, UART)來偵錯時，卻發現輸出亂碼，下列何者 為最「不可能」的解決方法?", "type": "單選題", "ans": "C", "options": ["A. 更換序列連接埠(Serialport)通訊程式", "B. 重新插上電源並重啟偵錯軟體", "C. 將RX與TX的接頭對調位置", "D. 變更鮑率，並確保兩端設定皆為相同數值"]}, {"id": 116, "exam": "109-1 初級物聯網應用工程師", "num": "16", "title": "進行 Arduino 韌體上傳時發生錯誤，「不可能」是以下何種原因?", "type": "單選題", "ans": "C", "options": ["A. 沒有設定對開發板類型", "B. 與開發板的連線中斷", "C. 通用非同步收發傳輸器(UniversalSynchronousAsynchronousReceiverTransmitter,UART)的鮑率設定錯誤", "D. 連接錯誤的序列連接埠(Serialport)"]}, {"id": 117, "exam": "109-1 初級物聯網應用工程師", "num": "17", "title": "當發現物聯網裝置讀取感測器數據異常，下列何者是工程師會優先 採取的行動?", "type": "單選題", "ans": "C", "options": ["A. 燒錄上一個版本的韌體", "B. 將感測器進行替換", "C. 重新啟動該感測器再次讀取資料", "D. 透過三用電表檢查通電狀態"]}, {"id": 118, "exam": "109-1 初級物聯網應用工程師", "num": "18", "title": "某超市欲採用 UHF RFID Tag 來取代傳統條碼，下列何者在通過讀取 器(Reader)讀取時比較容易發生讀取錯誤?", "type": "單選題", "ans": "D", "options": ["A. 袋裝泡麵", "B. 服飾吊牌", "C. 雜誌書籍", "D. 冷凍食品"]}, {"id": 119, "exam": "109-1 初級物聯網應用工程師", "num": "19", "title": "使用邏輯分析儀之同步模式，可針對感測網路節點的何種訊號特性 進行分析?", "type": "單選題", "ans": "B", "options": ["A. 時序分析", "B. 狀態分析", "C. 暫態信號分析", "D. 頻率計數分析"]}, {"id": 120, "exam": "109-1 初級物聯網應用工程師", "num": "20", "title": "在 Arduino 整合開發環境(IDE)中，若無法找到對應的序列連接埠 (Serial port)，下列何者是不可能發生的原因?", "type": "單選題", "ans": "D", "options": ["A. ArduinoUSB驅動程式沒有安裝好", "B. 用到壞的USB連接線", "C. Serialport正在被占用", "D. 作業系統尚未更新至最新版"]}, {"id": 121, "exam": "109-1 初級物聯網應用工程師", "num": "21", "title": "透過開發板連接感測器模組時，發現讀出的數值異常或無法讀取， 下列何者「無法」有效解決問題?", "type": "單選題", "ans": "A", "options": ["A. 將USB電源改為DC電源輸入", "B. 接到其它的開發板進行模組讀取測試", "C. 檢查讀取的接腳是否設定正確", "D. 檢查感測器模組的供電電壓與接地是否正確"]}, {"id": 122, "exam": "109-1 初級物聯網應用工程師", "num": "22", "title": "開放網路應用安全計畫(OWASP)對物聯網提出十大弱點風險之建 議，其中第三項定義為「Insecure Ecosystem Interfaces」。基於此明確 之項目名稱，下列何者較「不應」包含於該項目內?", "type": "單選題", "ans": "B", "options": ["A. Insecurewebinterfaces", "B. Integrityandavailabilityofinformation", "C. Cloudormobileinterfaces", "D. Lackofinputoroutputfiltering"]}, {"id": 123, "exam": "109-1 初級物聯網應用工程師", "num": "23", "title": "針對 RFID 讀取器位置、用戶資料和用戶位置等隱私問題，下列之 隱私保護機制中，何者具備計算量小、資源損耗低、虛擬隨機性和 單向不可逆之特性?", "type": "單選題", "ans": "A", "options": ["A. 雜湊函數(Hashfunction)法", "B. 雙重加密法", "C. 匿名ID法", "D. 第三方認證法"]}, {"id": 124, "exam": "109-1 初級物聯網應用工程師", "num": "24", "title": "下列何者最容易被外部駭客植入惡意程式，透過遠端操控發動分散 式阻斷服務攻擊(DDoS attack)，癱瘓指定的 DNS 服務系統?", "type": "單選題", "ans": "B", "options": ["A. 監控與資料擷取系統(SCADASystem)", "B. 網路攝影機(IPCamera)", "C. 智慧電視(SmartTV)", "D. 可編程邏輯控制器(PLC)"]}, {"id": 125, "exam": "109-1 初級物聯網應用工程師", "num": "25", "title": "關於 IoT 安全評等(IoT Security Rating, IoT SR)所提供物聯網產品 的資訊安全評估標準，其考量可分為七大類別，下列何者較「不可 能」被包含於 IoT SR 評估項目中?", "type": "單選題", "ans": "D", "options": ["A. 安全軟體更新與系統管理", "B. 資料加密與隱私需求", "C. 安全通訊與文件流程需求", "D. 設備特性與用戶對象"]}, {"id": 126, "exam": "109-1 初級物聯網應用工程師", "num": "26", "title": "下列何種管理方式最容易產生潛在的物聯網資訊安全問題?", "type": "單選題", "ans": "D", "options": ["A. 定期重啟與重置物聯網設備以清除可能潛在之惡意程式", "B. 透過設備內建之存取控制功能或獨立防火牆來限制連線", "C. 將設備預設密碼修改為符合複雜性原則之密碼", "D. 為節省管理成本，所有感應器所蒐集到的資料都應彙整到某個資料庫"]}, {"id": 127, "exam": "109-1 初級物聯網應用工程師", "num": "27", "title": "有一主板 Master 已接上 Sensor 且可以正常開機，每次執行 Sensor 的控制程式時主板都會重開機，進行除錯時，下列何者「不可能」發生?", "type": "單選題", "ans": "C", "options": ["A. Sensor 耗電過大", "B. Sensor 的輸出接到 VCC", "C. Master 的 VCC 接到 GND", "D. Master 供電不足"]}, {"id": 128, "exam": "109-1 初級物聯網應用工程師", "num": "28", "title": "請問下列何者「不是」開源硬體?", "type": "單選題", "ans": "A", "options": ["A. LinkIt", "B. Arduino", "C. BeagleBone", "D. Cubieboard"]}, {"id": 129, "exam": "109-1 初級物聯網應用工程師", "num": "29", "title": "關於開源硬體，下列敘述何者「不正確」?", "type": "單選題", "ans": "A", "options": ["A. 發佈開源硬體項目時，必須公佈所有的檔案及文件", "B. 開源硬體授權需要處理硬體設計文件及軟體操作文件", "C. 使用者遵守授權條款的內容，便可以自由商業化該條款提供的授權範圍", "D. 開源硬體的本質是共享一個硬體的設計文件以方便他人進行修改或製作硬體"]}, {"id": 130, "exam": "109-1 初級物聯網應用工程師", "num": "30", "title": "常見的創用 CC 授權條款是一種公共著作權授權條款，用來散佈開 源硬體的設計文件，在創用 CC 授權條款四個元素、使用中的六種 組合裡，下列何者是必然會出現的元素?", "type": "單選題", "ans": "C", "options": ["A. 相同方式分享(ShareAlike)", "B. 禁止改作(NoDerivatives)", "C. 姓名標示(Attribution)", "D. 非商業性(Non-Commercial)"]}, {"id": 131, "exam": "109-1 初級物聯網應用工程師", "num": "31", "title": "關於開源硬體的授權，下列敘述何者「不正確」?", "type": "單選題", "ans": "D", "options": ["A. 開源硬體授權允許改作或後續使用的授權範圍", "B. 即使是開源硬體，仍要經授權，才可在硬體中顯示其他公司商標", "C. 開源硬體授權是較為廣泛的應用範圍，包含軟體授權、設計圖授權", "D. 即使使用者遵守授權條款的內容，仍不可以自由散佈或修改原始檔案"]}, {"id": 132, "exam": "109-1 初級物聯網應用工程師", "num": "32", "title": "下列何者「不是」開源硬體授權所要處理的問題?", "type": "單選題", "ans": "C", "options": ["A. 硬體設計文件", "B. 軟體操作文件", "C. 授權參考價格或預訂價格", "D. 允許改作或後續使用的授權範圍"]}, {"id": 133, "exam": "109-1 初級物聯網應用工程師", "num": "33", "title": "下列何者通訊協定「不可以」與多個裝置溝通?", "type": "單選題", "ans": "B", "options": ["A. I2C(Inter-IntegratedCircuit)", "B. RS-232", "C. SPI(SerialPeripheralInterface)", "D. RS-485"]}, {"id": 134, "exam": "109-1 初級物聯網應用工程師", "num": "34", "title": "關於 I2C(Inter-Integrated Circuit)，下列敘述何者「不正確」?", "type": "單選題", "ans": "A", "options": ["A. 單只使用兩條傳輸線，分別是傳送資料與接收資料", "B. 透過I2C位址(I2C Address)來決定將資料傳送至哪個裝置", "C. I2C是一種串列式的傳輸方式", "D. I2C裝置可以是主裝置(Master)也可是從裝置(Slave)"]}, {"id": 135, "exam": "109-1 初級物聯網應用工程師", "num": "35", "title": "關於 RS-485 與 RS-232 之比較，下列敘述何者「不正確」?", "type": "單選題", "ans": "C", "options": ["A. RS-485使用一對雙絞線，數據信號採用差動方式(differential)傳輸", "B. RS-232鮑率(baudrate)越高，其傳輸速率就越大，但穩定的傳輸距離就越短", "C. RS-232採取平衡傳輸方式而RS-485採取不平衡傳輸", "D. RS-232因共模干擾等問題因此一般連線距離約在20公尺內，而RS-485通訊距離可達1200公尺"]}, {"id": 136, "exam": "109-1 初級物聯網應用工程師", "num": "36", "title": "開發智慧家庭的應用，如在辦公室透過手機遙控家裡的電器並讀取 客廳溫度。關於使用樹莓派(Raspberry Pi)與感測器來達成上述需 求的建置步驟，請問下列何者「不正確」?", "type": "單選題", "ans": "D", "options": ["A. 在RaspberryPi上建立WebServer網站", "B. 設定WebServer固定的IP網路位址", "C. 可用python撰寫CGI程式讓網頁伺服器呼叫使用", "D. 不需要RaspberryPiroot管理者的權限即可以使用GPIO"]}, {"id": 137, "exam": "109-1 初級物聯網應用工程師", "num": "37", "title": "關於同步傳輸與非同步傳輸，下列敘述何者「不正確」?", "type": "單選題", "ans": "A", "options": ["A. I2C採用非同步傳輸介面;SPI採用同步傳輸介面，所以I2C傳輸速率較SPI慢", "B. 同步傳輸需要傳送較少的控制位元，非同步傳輸需要傳送的控制位元比較多", "C. 同步傳輸常運用在主機間的資料傳輸，非同步傳輸常用於主機與周邊設備間的資料傳輸", "D. 同步傳輸的效率比非同步傳輸的效率高"]}, {"id": 138, "exam": "109-1 初級物聯網應用工程師", "num": "38", "title": "USB OTG(on-the-go)是在 USB2.0 引入的一種模式，它允許原本只能為週邊的裝置(Peripheral device)也能成為主機(Host)，即成 為一個 dual-role device，例如讓鍵盤接上手機使用。此 Host 與 Peripheral device 角色協調互換是依據下列何種協定運作?", "type": "單選題", "ans": "B", "options": ["A. 接附偵測協定(AttachDetectionProtocol)", "B. 主機通令協議(HostNegotiationProtocol)", "C. 會談起始協定(SessionInitiationProtocol)", "D. 會談請求協定(SessionRequestProtocol)"]}, {"id": 139, "exam": "109-1 初級物聯網應用工程師", "num": "39", "title": "SPI 介面的資料通訊以主從(master-slave)模式運作。下列敘述何者 「不正確」?", "type": "單選題", "ans": "C", "options": ["A. SPI主從模式通常有一個主裝置和一個或多個從裝置", "B. SPI介面在點對點的通訊中，不需要進行定址操作，且可為全雙工通訊", "C. SPI是序列資料傳輸協定，資料是以位元的方式，根據從裝置送出的鐘控信號(SCK)進行傳輸", "D. SPI介面沒有應答機制(acknowledgement)來確認資料接收與否"]}, {"id": 140, "exam": "109-1 初級物聯網應用工程師", "num": "40", "title": "關於開源軟體的定義，下列何者「不正確」?", "type": "單選題", "ans": "B", "options": ["A. 程式的可執行檔在散佈時，必須隨附完整原始碼或取得原始碼的方法", "B. 當開源軟體與其他非開源軟體一起散佈時，其他軟體也要遵照開源軟體授權", "C. 開源軟體可以使用在商業用途上", "D. 原始碼修改後必須以不同的版本號碼發佈，保障原始碼完整性"]}, {"id": 141, "exam": "109-1 初級物聯網應用工程師", "num": "41", "title": "下列何者必須開放原始碼?", "type": "單選題", "ans": "A", "options": ["A. 自由軟體(FreeSoftware)", "B. 共享軟體(Shareware)", "C. 免費軟體(Freeware)", "D. 商業軟體(CommercialSoftware)"]}, {"id": 142, "exam": "109-1 初級物聯網應用工程師", "num": "42", "title": "若開發了一個開源軟體，但不想讓之後的使用者將它改為閉源的方 式發行，應採用下列何種授權方式?", "type": "單選題", "ans": "C", "options": ["A. Apache授權", "B. BSD(BerkeleySoftwareDistributionLicense)授權", "C. GPL(GNUGeneralPublicLicense)授權", "D. MIT(MassachusettsInstituteofTechnology)授權"]}, {"id": 143, "exam": "109-1 初級物聯網應用工程師", "num": "43", "title": "物聯網裝置的興起，帶動了雲端資料量的急遽成長，也因此 NoSQL成為一種雲端平台資料庫的選擇。下列何者「不屬於」NoSQL 資料 庫?", "type": "單選題", "ans": "A", "options": ["A. MariaDB", "B. Redis", "C. HBase", "D. MongoDB"]}, {"id": 144, "exam": "109-1 初級物聯網應用工程師", "num": "44", "title": "如附圖所示，雲端運算共分為 IaaS、PaaS、SaaS，請問若從以雲端 金字塔的架構，從上而下依序為何?", "type": "單選題", "ans": "B", "options": ["A. IaaS->PaaS->SaaS", "B. SaaS->PaaS->IaaS", "C. PaaS->SaaS->IaaS", "D. IaaS->SaaS->PaaS"]}, {"id": 145, "exam": "109-1 初級物聯網應用工程師", "num": "45", "title": "開放資料(Open Data)是物聯網雲端服務取得資料的來源之一。下 列何者「不屬於」開放資料的主要格式?", "type": "單選題", "ans": "D", "options": ["A. CSV", "B. JSON", "C. XML", "D. DOC"]}, {"id": 146, "exam": "109-1 初級物聯網應用工程師", "num": "46", "title": "關於物聯網雲端平台，下列敘述何者「不正確」?", "type": "單選題", "ans": "B", "options": ["A. 物聯網雲端平台可負責資料的蒐集、儲存、查詢與分析", "B. 物聯網雲端平台不負責監控數據變更通知", "C. 透過車聯網上面收集到的車輛大數據，可以為廠商帶來推廣加值服務的效益", "D. 透過光度、溫度、濕度、風速、大氣壓力等感測器資訊，我們可以更加了解環境變化"]}, {"id": 147, "exam": "109-1 初級物聯網應用工程師", "num": "47", "title": "關於雲端平台的系統設計與數據處理，下列敘述何者「不正確」?", "type": "單選題", "ans": "C", "options": ["A. 雲端服務的數據資料種類眾多，不易處理", "B. 雲端服務的數據，有時會來自於開放資料", "C. 雲端服務的系統設計需滿足集中化資料備份的服務", "D. 雲端服務的系統設計需要即時的部署，且可動態來進行調整擴充所需的資源"]}, {"id": 148, "exam": "109-1 初級物聯網應用工程師", "num": "48", "title": "物聯網設備種類繁多，所產出的數據訊息格式和形式不一致。藉由 物聯網雲端服務營運管理平台，企業可以理解不同設備產出之不同 訊息格式及形式的數據，進而確保設備互通性。關於物聯網裝置和 雲端之間常見的訊息協議，下列何者「不正確」?", "type": "單選題", "ans": "C", "options": ["A. HTTP", "B. REST", "C. Zigbee", "D. MQTT"]}, {"id": 149, "exam": "109-1 初級物聯網應用工程師", "num": "49", "title": "關於雲端物聯網平台，下列敘述何者「不正確」?", "type": "單選題", "ans": "D", "options": ["A. 在更新管道方面，可透過OTA進行更新", "B. 在資料儲存方面更容易擴充", "C. 在連線方面，可以通過限制進出雲端API閘道的流量來減少受攻擊的層面", "D. 在認證方面，所有的雲端平台皆提供單一登入(SSO)功能"]}, {"id": 150, "exam": "109-1 初級物聯網應用工程師", "num": "50", "title": "關於雲端平台設計時需考量的因素，下列敘述何者「不正確」?", "type": "單選題", "ans": "B", "options": ["A. 雲端平台需提供認證授權機制以識別裝置的身份", "B. 雲端平台需主動接收由物聯網裝置被動上傳的監測數據", "C. 雲端平台藉由感測器收集使用者的數據，之後可使用雲端系統分析", "D. 雲端平台採用可延伸擴展的資料儲存技術，以滿足大量儲存資料的需求"]}, {"id": 151, "exam": "109-2 物聯網應用工程師 - 物聯網系統與應用", "num": "1", "title": "下列何種物聯網開發板「沒有」內建類比輸入支援？", "type": "單選題", "ans": "D", "options": ["A. Arduino", "B. BeagleBone", "C. Micro:bit", "D. Raspberry Pi"]}, {"id": 152, "exam": "109-2 物聯網應用工程師 - 物聯網系統與應用", "num": "2", "title": "微控制器可解決設備的控制需求，甚至可開發更多元的整合應用，挑選合宜的微控制器板是非常重要的關鍵，下列何者「不」屬於挑選的標準？", "type": "單選題", "ans": "D", "options": ["A. 體積大小", "B. 成本高低", "C. 產品規格", "D. 面板顏色"]}, {"id": 153, "exam": "109-2 物聯網應用工程師 - 物聯網系統與應用", "num": "3", "title": "從感測器所取得的數值是屬於用連續量來顯示電器訊號的類比訊號，請問在轉換成離散值的數位訊號「不」會經過下列何者步驟？", "type": "單選題", "ans": "A", "options": ["A. Normalization", "B. Sampling", "C. Quantization", "D. Coding"]}, {"id": 154, "exam": "109-2 物聯網應用工程師 - 物聯網系統與應用", "num": "4", "title": "若想透過發光二極體（LED）來進行簡單亮燈測試，下列敘述何者正確？", "type": "單選題", "ans": "C", "options": ["A. 不連接電阻就不會亮燈", "B. 短腳的接腳是連接負極（GND）", "C. 可以使用 5V 或 3.3V 電壓", "D. 若使用水銀電池，通常會接上 10kΩ 電阻以防燒毀"]}, {"id": 155, "exam": "109-2 物聯網應用工程師 - 物聯網系統與應用", "num": "5", "title": "關於感測器的訊號處理流程，何者排序內容正確？甲、增幅電路；乙、轉換成數值；丙、轉換成類比/數位；丁、檢測對象；戊、感測器", "type": "單選題", "ans": "C", "options": ["A. 丁、戊、丙、乙、甲", "B. 戊、丁、丙、甲、乙", "C. 丁、戊、甲、丙、乙", "D. 丁、甲、戊、丙、乙"]}, {"id": 156, "exam": "109-2 物聯網應用工程師 - 物聯網系統與應用", "num": "6", "title": "如果想要使用無線技術進行室內定位，下列何種無線技術最為精準？", "type": "單選題", "ans": "D", "options": ["A. 藍牙（Bluetooth）", "B. 無線射頻識別（Radio Frequency Identification, RFID）", "C. 全球定位系統（Global Positioning System, GPS）", "D. 超寬頻（Ultra-WideBand, UWB）"]}, {"id": 157, "exam": "109-2 物聯網應用工程師 - 物聯網系統與應用", "num": "7", "title": "無線傳輸時需要進行調變，下列何者「不」是類比調變技術？", "type": "單選題", "ans": "B", "options": ["A. 振幅調變", "B. 波長調變", "C. 頻率調變", "D. 相位調變"]}, {"id": 158, "exam": "109-2 物聯網應用工程師 - 物聯網系統與應用", "num": "8", "title": "請問下列何種通訊模組耗電量最低？", "type": "單選題", "ans": "A", "options": ["A. NFC", "B. Wi-Fi", "C. Bluetooth", "D. 4G"]}, {"id": 159, "exam": "109-2 物聯網應用工程師 - 物聯網系統與應用", "num": "9", "title": "關於近場通訊（Near Field Communication, NFC）技術，下列敘述何者正確？", "type": "單選題", "ans": "D", "options": ["A. NFC 的傳輸距離大於 20 公分", "B. NFC 的點對點模式（Peer-toPeer mode）無法用於資料交換", "C. NFC 的卡模擬模式（Card emulation mode）不需電源也可運作", "D. NFC 的讀卡模式（Reader/Writer mode）可讀取電子標籤上的資訊"]}, {"id": 160, "exam": "109-2 物聯網應用工程師 - 物聯網系統與應用", "num": "10", "title": "若要在各產品生產線上透過攝影機來判斷該產線上的產品是否有瑕疵，且數據資料最後會傳回到中央主機分析、儲存並產生報表。由於瑕疵品必須立刻從產線上移除，因此在每條產線上都額外架設了一部主機來處理瑕疵品偵測與移除等工作。我們稱這部主機為何？", "type": "單選題", "ans": "C", "options": ["A. 行動運算", "B. 自主運算", "C. 邊緣運算", "D. 網格運算"]}, {"id": 161, "exam": "109-2 物聯網應用工程師 - 物聯網系統與應用", "num": "11", "title": "關於無線感測網路（Wireless Sensor Network, WSN），下列敘述何者「不」正確？", "type": "單選題", "ans": "B", "options": ["A. 無線感測器的節點在能夠傳輸範圍內藉由無線通訊溝通", "B. 無線網路節點包含感測單元、記憶儲存單元、無線傳輸單元、電源供應單元", "C. 無線感測網路通常由大量無線感測單元組成", "  {"id": 200, "exam": "109-2 物聯網應用工程師 - 物聯網系統與應用", "num": "50", "title": "若單純的呼叫、以動態連結的方式使用函式庫，則下列何種授權「不」會被視為衍生作品，而受到授權拘束？", "type": "單選題", "ans": "C", "options": ["A. GPL", "B. MPL", "C. LGPL", "D. CDDL"]}];

        let selectedOrderMode = 'sequential'; // 'sequential' or 'random'
        let currentQuizList = [];
        let currentIndex = 0;
        let userAnswers = {}; // qId -> { selected: 'A', isCorrect: true/false }
        let correctCount = 0;
        let wrongCount = 0;

        function setOrderMode(mode) {
            selectedOrderMode = mode;
            document.getElementById('modeBtnSequential').classList.toggle('active', mode === 'sequential');
            document.getElementById('modeBtnRandom').classList.toggle('active', mode === 'random');
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz() {
            const scope = document.getElementById('scopeSelect').value;
            let filtered = [];

            if (scope === 'ALL') {
                filtered = [...rawDatabase];
            } else {
                filtered = rawDatabase.filter(q => q.exam.includes(scope));
            }

            if (selectedOrderMode === 'random') {
                currentQuizList = shuffleArray(filtered);
            } else {
                currentQuizList = [...filtered];
            }

            userAnswers = {};
            correctCount = 0;
            wrongCount = 0;
            currentIndex = 0;

            document.getElementById('correctCount').innerText = '0';
            document.getElementById('wrongCount').innerText = '0';

            const modeLabel = selectedOrderMode === 'random' ? '🔀 隨機模式' : '📌 順序模式';
            const scopeText = scope === 'ALL' ? '全部 200 題' : scope;
            document.getElementById('currentModeTag').innerText = `${modeLabel} | ${scopeText} (共 ${currentQuizList.length} 題)`;

            document.getElementById('setupView').style.display = 'none';
            document.getElementById('resultView').style.display = 'none';
            document.getElementById('quizView').style.display = 'block';

            renderQuestion();
            renderPagination();
        }

        function restartCurrentQuiz() {
            // Re-start: if random mode, re-shuffle!
            startQuiz();
        }

        function exitToSetup() {
            document.getElementById('quizView').style.display = 'none';
            document.getElementById('resultView').style.display = 'none';
            document.getElementById('setupView').style.display = 'block';
        }

        function renderQuestion() {
            if (currentQuizList.length === 0) return;
            const q = currentQuizList[currentIndex];
            const container = document.getElementById('quizContainer');
            const record = userAnswers[q.id];

            let optionsHtml = '';
            q.options.forEach((optStr) => {
                const match = optStr.match(/^([A-D])\.\s*(.*)/);
                let optLetter = '';
                if (match) {
                    optLetter = match[1];
                } else {
                    optLetter = optStr.substring(0, 1).toUpperCase();
                }

                let btnClass = 'option-btn';
                let disabled = '';

                if (record) {
                    disabled = 'disabled';
                    if (record.selected.includes(optLetter)) {
                        btnClass += record.isCorrect ? ' selected-correct' : ' selected-wrong';
                    } else if (!record.isCorrect && q.ans.includes(optLetter)) {
                        btnClass += ' show-truth';
                    }
                }

                optionsHtml += `<button class="${btnClass}" ${disabled} onclick="selectOption('${q.id}', '${optLetter}')">
                    ${optStr}
                </button>`;
            });

            let feedbackHtml = '';
            if (record) {
                if (record.isCorrect) {
                    feedbackHtml = `<div class="feedback-box correct">🎉 回答正確！答案就是 [ ${q.ans} ]</div>`;
                } else {
                    feedbackHtml = `<div class="feedback-box wrong">
                        ❌ <strong>回答錯誤！</strong> 您選擇了 (${record.selected})<br>
                        👉 正確答案是：<strong>[ ${q.ans} ]</strong>
                    </div>`;
                }
            }

            container.innerHTML = `
                <div class="quiz-card">
                    <div class="q-header">
                        <span class="q-tag">${q.exam}</span>
                        <span class="q-num">第 ${currentIndex + 1} / ${currentQuizList.length} 題（原題號：${q.num}）</span>
                    </div>
                    <div class="q-title">${q.title}</div>
                    <div class="options-list">${optionsHtml}</div>
                    ${feedbackHtml}
                </div>
            `;

            document.getElementById('prevBtn').disabled = (currentIndex === 0);
            
            // If on last question and answered, allow finishing
            const nextBtn = document.getElementById('nextBtn');
            if (currentIndex === currentQuizList.length - 1) {
                nextBtn.innerText = '🏁 完成作答';
                nextBtn.onclick = function() { checkFinish(); };
            } else {
                nextBtn.innerText = '下一題 →';
                nextBtn.onclick = function() { changeQuestion(1); };
            }

            updatePaginationActive();
        }

        function selectOption(qId, selectedLetter) {
            const q = currentQuizList.find(item => item.id == qId);
            if (!q || userAnswers[qId]) return;

            const isCorrect = q.ans.trim() === selectedLetter.trim() || q.ans.includes(selectedLetter);

            userAnswers[qId] = {
                selected: selectedLetter,
                isCorrect: isCorrect
            };

            if (isCorrect) {
                correctCount++;
            } else {
                wrongCount++;
            }

            document.getElementById('correctCount').innerText = correctCount;
            document.getElementById('wrongCount').innerText = wrongCount;

            renderQuestion();
            renderPagination();
        }

        function changeQuestion(dir) {
            const newIndex = currentIndex + dir;
            if (newIndex >= 0 && newIndex < currentQuizList.length) {
                currentIndex = newIndex;
                renderQuestion();
            }
        }

        function jumpToQuestion(index) {
            currentIndex = index;
            renderQuestion();
        }

        function checkFinish() {
            const total = currentQuizList.length;
            const answered = Object.keys(userAnswers).length;
            
            showResult();
        }

        function showResult() {
            const total = currentQuizList.length;
            const scorePercent = Math.round((correctCount / total) * 100);

            document.getElementById('quizView').style.display = 'none';
            document.getElementById('resultView').style.display = 'block';

            document.getElementById('resultScoreText').innerText = `${correctCount} / ${total} 題 (${scorePercent}分)`;
            document.getElementById('resultDetailText').innerText = `正確率：${scorePercent}% | 正確 ${correctCount} 題 ‧ 錯誤 ${wrongCount} 題 ‧ 未答 ${total - correctCount - wrongCount} 題`;
        }

        function renderPagination() {
            const bar = document.getElementById('paginationBar');
            let html = '';
            currentQuizList.forEach((q, idx) => {
                const rec = userAnswers[q.id];
                let statusClass = '';
                if (rec) {
                    statusClass = rec.isCorrect ? 'done-correct' : 'done-wrong';
                }
                if (idx === currentIndex) {
                    statusClass += ' active';
                }

                html += `<div class="page-num ${statusClass}" onclick="jumpToQuestion(${idx})">${idx + 1}</div>`;
            });
            bar.innerHTML = html;
        }

        function updatePaginationActive() {
            const pageBtns = document.querySelectorAll('.page-num');
            pageBtns.forEach((btn, idx) => {
                if (idx === currentIndex) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
    </script>
